   if(c.state==='in'){g.position.z+=1.3*dt;g.position.y=Math.abs(Math.sin(tm*8))*.03;if(g.position.z>=-2.4){c.state='wait';cur=c;setOrd(c)}}
   else if(c.state==='wait'){c.w+=dt;g.position.y=c.mon?0:Math.sin(tm*2)*.008;
    if(g.userData.mon){const L=lit(g.position.clone().setY(1.6));g.userData.tell.visible=L;if(c.type==='light'){c.lt=L?(c.lt||0)+dt:Math.max(0,(c.lt||0)-dt);if(c.lt>1.4){msg('Монстр боится света и убегает!');SFX.hiss();leave(c);continue}}if(c.type==='freeze'){if(!facing()||whOpen||wa)g.position.z+=.45*dt;if(g.position.z>-1.1)lose('Монстр, пока вы не смотрели, зашёл за стойку.')}}
    if(c.w>pat){if(c.mon){lose('Монстр устал ждать и сам зашёл за стойку.')}else{comp++;leave(c);msg('Клиент ушёл, не дождавшись. Жалоба!');SFX.err();check()}}}
   else{g.rotation.y=c.type==='odd'?0:Math.PI;g.position.z-=(c.type==='odd'?.7:1.6)*dt;g.position.y=Math.abs(Math.sin(tm*8))*.03;if(g.userData.tell)g.userData.tell.visible=false;if(g.position.z<-4.8){S.remove(g);custs.splice(custs.indexOf(c),1)}}}
  /* монстр на складе: с 3 ночи, выглядывает из-за двери */
  if(!bm.on){bm.next-=dt;if(bm.next<=0){bm.on=true;bm.p=.08;bm.g=0;SFX.creak()}}
  else{if(bg.visible&&lit(bg.position.clone().setY(1.6)))bm.p-=.4*dt;else bm.p+=(.045+(night-2)*.025)*dt;
   if(bm.p>.55&&!bm.g){bm.g=1;SFX.growl()}
   if(bm.p<=0){bm.on=false;bm.p=0;bm.next=Math.max(10,(34-night*4)*(.7+Math.random()*.6));SFX.slam();SFX.hiss()}
   else if(bm.p>=1)lose('Монстр из склада подкрался со спины.')}
  evTick(dt);if(t>=T)win();
 }
 if(mode==='play'){const tA=wa?1.1:bm.on?.45+Math.min(bm.p,.6)*.9:0;doorA+=(tA-doorA)*Math.min(1,dt*(bm.on?1.2:10));bg.visible=bm.on&&doorA>.3;
  if(bm.on){bg.position.z=5.78-Math.max(0,bm.p-.3)*4.2;bg.position.x=Math.sin(tm*3)*.12}}
 dp.rotation.y=doorA;
 cam.rotation.set(pitch,yaw,roll);if(mode!=='roof'&&mode!=='end'&&mode!=='wake')cam.position.set(P.x,1.45+Math.sin(tm*1.3)*.01,P.z);
 spot.intensity=((mode==='play'||mode==='run')&&fl&&bat>0)?(bat<20?(Math.random()<.5?1.5:.4):2.4):0;
 fh.material.color.setHex(spot.intensity?0xfff3c0:0x444444);
 scanT=Math.max(0,scanT-dt);laser.visible=scanT>0;sc.position.y=-.27+scanT*.05;if(scanT<=0&&Math.random()<.01&&mode==='play')setScr(cur?'КЛИЕНТ У СТОЙКИ':'ГОТОВ');
 lamp.intensity=(run?.2:1.1)+(Math.random()<.015?-.8:0)*(run?.2:1);lamp2.intensity=run?.05:.45;if(blk>0){blk-=dt;lamp.intensity=0;lamp2.intensity=0;amb.intensity=.04;if(blk<=0){amb.intensity=run?.15:.5;SFX.click();msg('Свет вернулся')}}
 if(camOpen&&mode==='play')camRender();else R.render(S,cam)}
menu();loop();
}
